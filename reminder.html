    <div class="container">

<h1>🔔 Notifications</h1>

<p class="subtitle">
Upcoming task reminders and deadlines
</p>

<div class="notification-list" id="notificationList">
  <!-- Dynamic notifications will be injected here -->
</div>

<div class="exit">
  <button onclick="goBack()">
    ← Exit to Dashboard
  </button>
</div>

</div>

<script>
  function logout(event) {
    if (event) event.preventDefault();
    localStorage.removeItem("isLoggedIn");
    window.location.href = "login.html";
  }

  function goBack() {
    window.location.href = "dashboard.html";
  }

  function loadNotifications() {
    let storedTasks = localStorage.getItem("studentTasks");
    let tasks = storedTasks ? JSON.parse(storedTasks) : [
      { title: "UID Project Implementation Plan", priority: "High", date: "2026-06-03", completed: false },
      { title: "Database Assignment 3", priority: "Medium", date: "2026-06-05", completed: false },
      { title: "Java Coding Exercises", priority: "Low", date: "2026-06-10", completed: true }
    ];

    let pendingTasks = tasks.filter(t => !t.completed);
    let listDiv = document.getElementById("notificationList");
    listDiv.innerHTML = "";

    if (pendingTasks.length === 0) {
      listDiv.innerHTML = `
        <div class="notification low" style="border-left: 4px solid var(--primary); background: linear-gradient(135deg, rgba(16, 185, 129, 0.04) 0%, rgba(3, 8, 12, 0.5) 100%);">
          <div class="left">
            <div class="icon">✨</div>
            <div class="message">
              <h3>All Caught Up!</h3>
              <p>You have no pending tasks or upcoming deadlines. Great job!</p>
            </div>
          </div>
          <div class="time">Now</div>
        </div>`;
      return;
    }

    // Get today's date in local system YYYY-MM-DD
    let today = new Date();
    today.setHours(0, 0, 0, 0);
    let todayTime = today.getTime();

    pendingTasks.forEach(task => {
      let classType = "low";
      let icon = "📝";
      let timeStr = "Upcoming";
      let messageDesc = "";

      if (task.date) {
        let taskDate = new Date(task.date);
        taskDate.setHours(0, 0, 0, 0);
        let taskTime = taskDate.getTime();

        if (taskTime < todayTime) {
          classType = "high";
          icon = "⚠️";
          timeStr = "Overdue";
          messageDesc = `This task is overdue (was due on ${task.date}). Please complete it immediately!`;
        } else if (taskTime === todayTime) {
          classType = "high";
          icon = "🔔";
          timeStr = "Today";
          messageDesc = `This task is due today! Priority level is ${task.priority}.`;
        } else {
          // Future task
          if (task.priority === "High") {
            classType = "medium";
            icon = "📚";
          } else {
            classType = "low";
            icon = "📝";
          }
          timeStr = task.date;
          messageDesc = `Upcoming task due on ${task.date}. Priority: ${task.priority}.`;
        }
      } else {
        timeStr = "No Date";
        messageDesc = `Task has no due date. Priority: ${task.priority}.`;
        if (task.priority === "High") {
          classType = "medium";
          icon = "📚";
        }
      }

      let div = document.createElement("div");
      div.className = `notification ${classType}`;
      div.innerHTML = `
        <div class="left">
          <div class="icon">${icon}</div>
          <div class="message">
            <h3>${task.title}</h3>
            <p>${messageDesc}</p>
          </div>
        </div>
        <div class="time">${timeStr}</div>
      `;
      listDiv.appendChild(div);
    });
  }

  loadNotifications();
</script>
