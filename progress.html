<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress — Student Task Manager</title>
    
    <script>
      // Authentication gate check
      if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "login.html";
      }
    </script>
    
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="codestyle.css">
</head>

<body class="page-progress">
    <!-- Animated Ambient Glass Orbs (Emerald & Gold Aurora) -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top glass-navbar py-3">
      <div class="container-xl">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="fs-4">📚</span>
          <span class="fw-bold tracking-wider fs-6 text-white">STUDENT<span class="text-primary"> TASK </span>MANAGER</span>
        </a>
        
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav mx-auto mb-2 mb-md-0 gap-2">
            <li class="nav-item"><a class="nav-link text-secondary" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="task.html">Tasks</a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="schedule.html">Schedule</a></li>
            <li class="nav-item"><a class="nav-link text-primary active" href="progress.html">Progress</a></li>
            <li class="nav-item"><a class="nav-link text-secondary" href="reminder.html">Notifications</a></li>
          </ul>
          <div class="d-flex gap-2">
            <a href="profile.html" class="btn btn-custom-outline py-2 px-3 fs-7">👤 Profile</a>
            <a href="#" onclick="logout(event)" class="btn btn-custom-primary py-2 px-3 fs-7 d-none d-sm-block">Logout</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container">

        <h1>📊 Progress Overview</h1>

        <div class="cards">
            <div class="card">
                <h3>Total Tasks</h3>
                <div class="number" id="statTotal">0</div>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <div class="number" id="statCompleted" style="color: var(--success);">0</div>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <div class="number" id="statPending" style="color: var(--accent-gold);">0</div>
            </div>

            <div class="card">
                <h3>Performance</h3>
                <div class="number" id="statPerformance">0%</div>
            </div>
        </div>

        <div class="progress-container">
            <h2>Task Completion Progress</h2>
            <br>
            <div class="progress-bar">
                <div class="progress" id="statProgressBar" style="width: 0%;"></div>
            </div>
        </div>

        <div class="exit">
            <button onclick="goBack()">← Exit to Dashboard</button>
        </div>

    </div>

    <script>
        function logout(event) {
            if (event) event.preventDefault();
            localStorage.removeItem("isLoggedIn");
            window.location.href = "login.html";
        }

        function loadProgress() {
            let storedTasks = localStorage.getItem("studentTasks");
            let tasks = storedTasks ? JSON.parse(storedTasks) : [
                { title: "UID Project Implementation Plan", priority: "High", date: "2026-06-03", completed: false },
                { title: "Database Assignment 3", priority: "Medium", date: "2026-06-05", completed: false },
                { title: "Java Coding Exercises", priority: "Low", date: "2026-06-10", completed: true }
            ];
            
            let total = tasks.length;
            let completed = tasks.filter(t => t.completed).length;
            let pending = total - completed;
            let performance = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById("statTotal").textContent = total;
            document.getElementById("statCompleted").textContent = completed;
            document.getElementById("statPending").textContent = pending;
            document.getElementById("statPerformance").textContent = performance + "%";
            document.getElementById("statProgressBar").style.width = performance + "%";
        }

        function goBack() {
            window.location.href = "Dashboard.html";
        }

        loadProgress();
    </script>

</body>
</html>
