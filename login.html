<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Student Task Manager</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="codestyle.css">
</head>
<body class="page-login">

  <!-- Ambient Floating Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="fs-1 mb-2">📚</div>
      <h2 class="fw-bold text-white mb-1" style="font-family: 'Outfit', sans-serif;">STUDENT <span class="text-primary" style="color: var(--primary) !important;">TASK</span> MANAGER</h2>
      <p class="text-secondary small">Enter your credentials to access the workspace</p>
    </div>

    <!-- Error Alert -->
    <div id="loginAlert" class="alert-custom mb-3" style="display: none;">
      <span style="font-size: 1.15rem;">⚠️</span>
      <span id="alertMsg" class="small">Invalid email or password.</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label for="usernameInput" class="glass-label mb-2">👤 Username or Email</label>
        <input type="text" id="usernameInput" class="glass-input" placeholder="e.g. admin@student.com" required>
      </div>

      <div class="mb-3">
        <label for="passwordInput" class="glass-label mb-2">🔒 Password</label>
        <input type="password" id="passwordInput" class="glass-input" placeholder="Enter password (min. 6 chars)" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" style="background-color: rgba(255,255,255,0.02); border-color: rgba(16, 185, 129, 0.3);">
          <label class="form-check-label text-secondary small" for="rememberMe">Remember Me</label>
        </div>
      </div>

      <button type="submit" class="btn-custom-primary w-100 mb-3">
        🚀 Enter Workspace
      </button>

      <a href="index.html" class="btn-custom-outline w-100 text-center text-decoration-none">
        ← Back to Landing Page
      </a>
    </form>

    <div class="mt-4 pt-3 border-top border-secondary border-opacity-10 text-center">
      <p class="text-muted small mb-1">Demo Credentials:</p>
      <code class="text-primary small" style="font-family: monospace;">admin@student.com / admin123</code>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "dashboard.html";
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const usernameInput = document.getElementById("usernameInput").value.trim();
      const passwordInput = document.getElementById("passwordInput").value;
      const alertEl = document.getElementById("loginAlert");
      const msgEl = document.getElementById("alertMsg");

      // Simple email validation pattern
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      // Basic client-side checks
      if (usernameInput === "") {
        showAlert("Please enter your username or email address.");
        return;
      }
      
      if (passwordInput.length < 6) {
        showAlert("Password must be at least 6 characters long.");
        return;
      }

      // Check credential validation (Demo account check or standard)
      if (usernameInput === "admin@student.com" && passwordInput !== "admin123") {
        showAlert("Incorrect password for admin demo account.");
        return;
      }

      // Login success
      localStorage.setItem("isLoggedIn", "true");
      
      // Initialize a default profile if none exists
      let storedProfile = localStorage.getItem("studentProfile");
      if (!storedProfile) {
        let name = usernameInput.split("@")[0];
        // Capitalize name
        name = name.charAt(0).toUpperCase() + name.slice(1);
        
        let profile = {
          name: name,
          email: emailPattern.test(usernameInput) ? usernameInput : name + "@example.com",
          phone: "9876543210",
          studentID: "AM.EN.U4CSE26001",
          year: "3rd Year",
          college: "Amrita Vishwa Vidyapeetham",
          goal: "Maintain consistent GPA and track daily CSE project milestones."
        };
        localStorage.setItem("studentProfile", JSON.stringify(profile));
      }

      window.location.href = "dashboard.html";
    }

    function showAlert(message) {
      const alertEl = document.getElementById("loginAlert");
      const msgEl = document.getElementById("alertMsg");
      msgEl.textContent = message;
      alertEl.style.display = "flex";
      
      // Auto-hide alert after 5 seconds
      setTimeout(() => {
        alertEl.style.display = "none";
      }, 5000);
    }
  </script>
</body>
</html>
